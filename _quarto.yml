project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "writing/*.qmd"
    - "!editor.qmd"
    - "!research.qmd"
    - "!writing/hello-quarto.qmd"
  resources:
    - "robots.txt"
    # Interlinking: committed static data + runtime script copied into _site/.
    # Generated by scripts/build_indexes.py (run locally; re-run when essays
    # change). Keeps the Vercel build Quarto-only — no build-time Python.
    - "related-index.json"
    - "link-index.json"
    - "assets/interlink.js"
    - "assets/site-ui.js"
    - "images/austin-p-morrissey-sebe-poster.webp"

website:
  title: "Austin P. Morrissey"
  site-url: https://austinmorrissey.com
  favicon: images/favicon.png
  description: "AI safety research focused on biosecurity capability evaluations."
  open-graph: true
  twitter-card: true
  search:
    location: navbar
    type: overlay

  # Quarto's navbar remains as a progressive fallback and supplies its tested
  # search/theme machinery. site-ui.js replaces only its visible presentation.
  navbar:
    pinned: false
    background: body
    title: "Austin P. Morrissey"
    collapse-below: sm
    toggle-position: right
    tools-collapse: true
    right:
      - text: Writing
        href: writing/index.qmd
      - text: About
        href: about.qmd

  page-footer:
    border: false
    center: |
      © 2026 Austin P. Morrissey · [RSS](/writing/index.xml) · [About](/about.html)

format:
  html:
    theme:
      dark:
        - slate
        - styles/_brand.scss
        - styles/custom-dark.scss
        - styles/interlink.scss
      light:
        - cosmo
        - styles/_brand.scss
        - styles/custom-light.scss
        - styles/interlink.scss
    # Keep the first-listed (dark) theme as the site's first-visit default.
    # A visitor can still switch themes; Quarto persists that choice locally.
    respect-user-color-scheme: false
    grid:
      sidebar-width: 240px
      body-width: 720px
      margin-width: 260px
      gutter-width: 1.5rem
    toc: true
    toc-location: left
    toc-depth: 3
    toc-expand: 2
    code-copy: true
    code-overflow: wrap
    code-link: true
    code-annotations: hover
    code-tools: false
    link-external-icon: false
    link-external-newwindow: true
    citations-hover: true
    crossrefs-hover: true
    smooth-scroll: true
    fig-cap-location: margin
    reference-location: margin
    citation-location: margin
    include-in-header:
      - _includes/json-ld-person.html
    include-before-body:
      - _includes/site-ui.html
    include-after-body:
      - _includes/footer-meta.html
      - _includes/interlink.html
