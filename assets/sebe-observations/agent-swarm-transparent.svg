<svg class="swarm-original" viewBox="0 0 1702 1390" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-swarm-transparent-title agent-swarm-transparent-desc">
<title id="agent-swarm-transparent-title">Agent swarm command structure</title>
<desc id="agent-swarm-transparent-desc">The original circular hierarchy: Opus 4.6 commander, two Sonnet 4.6 managers, four Haiku 4.5 translators, and four Haiku 4.5 executors. Each arrow carries its original label.</desc>
<style>
.swarm-original { --swarm-ink:#292b2c; --swarm-green:#299e42; --swarm-red:#ed3437; --swarm-paper:#fff; }
@media(prefers-color-scheme:dark) { .swarm-original { --swarm-ink:#e4e1db; --swarm-green:#79d97f; --swarm-red:#ff777a; --swarm-paper:#191919; } }
.swarm-original text { font-family:"Comic Sans MS","Chalkboard SE",cursive; text-anchor:middle; fill:var(--swarm-ink); font-size:23px; }
.swarm-original .swarm-arrow { fill:none; stroke:var(--swarm-ink); stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; }
.swarm-original .swarm-return { stroke:var(--swarm-green); }
.swarm-original .swarm-arrow-label { paint-order:stroke fill; stroke:var(--swarm-paper); stroke-width:9px; stroke-linejoin:round; }
.swarm-original .swarm-node-label { fill:#19201b; font-size:23px; }
.swarm-original .swarm-green-label { fill:var(--swarm-green); font-family:Inter,system-ui,sans-serif; font-weight:700; font-size:21px; }
</style>
