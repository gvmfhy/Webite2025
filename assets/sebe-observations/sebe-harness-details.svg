<svg class="sebe-native-diagram" viewBox="0 0 1000 1470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sebe-harness-details-title sebe-harness-details-desc">
<title id="sebe-harness-details-title">SEBE harness — June 12 handoff</title><desc id="sebe-harness-details-desc">The supplied architecture shows conversation history and a live coverage assessor feeding back to the steering model. Final scoring and the Inspect evaluation log follow the conversation.</desc>
<style>
.sebe-native-diagram { --ink:#384650; --muted:#596670; --neutral:#e1e5e7; --outline:#8e989f; --blue:#438eb6; --teal:#087f83; --copper:#aa482a; --green:#3c722f; --greenfill:#edf5e8; --red:#a8413d; --redfill:#f9e7e3; }
@media (prefers-color-scheme:dark) { .sebe-native-diagram { --ink:#d5d9dd; --muted:#b6bec4; --neutral:#2b3238; --outline:#83909a; --blue:#72b5db; --teal:#56c2c2; --copper:#e69a69; --green:#a9ce86; --greenfill:#283c20; --red:#efaaa4; --redfill:#512e2c; } }
.sebe-native-diagram text { font-family:Inter,system-ui,sans-serif; fill:var(--ink); text-anchor:middle; }
.sebe-native-diagram .n-title { font-size:29px; font-weight:700; }
.sebe-native-diagram .n-label { font-size:24px; }
.sebe-native-diagram .n-small { font-size:21px; fill:var(--muted); }
.sebe-native-diagram .n-white { fill:#fff; }
.sebe-native-diagram .n-neutral { fill:var(--neutral); stroke:var(--outline); stroke-width:1.5; }
.sebe-native-diagram .n-line { fill:none; stroke:var(--ink); stroke-width:2.5; stroke-linejoin:round; }
